name: Build device

on:
  workflow_call:
    inputs:
      PROJECT:
        description: "The project name"
        type: string
        required: true
      DEVICE:
        description: "The device name"
        type: string
        required: true
      BUILD_IMAGE:
        description: "Builder image reference"
        type: string
        required: true
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true
      OFFICIAL:
        description: "build official version"
        type: string
        required: true
      OTA_CHANNEL:
        description: "Validate an RGB30 OTA candidate when set"
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  build-arm:
    uses: ./.github/workflows/build-arm.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}

  build-aarch64-toolchain:
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/build-aarch64-toolchain.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}

  build-aarch64-rust:
    needs: build-aarch64-toolchain
    uses: ./.github/workflows/build-aarch64-rust.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}

  build-aarch64:
    needs: build-aarch64-toolchain
    uses: ./.github/workflows/build-aarch64.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}

  build-aarch64-mame-lr:
    needs: build-aarch64-toolchain
    uses: ./.github/workflows/build-aarch64-mame-lr.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}

  build-aarch64-qt6:
    needs: build-aarch64
    uses: ./.github/workflows/build-aarch64-qt6.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}

  build-aarch64-emu-libretro:
    permissions:
      contents: read
      packages: read
      actions: write
    needs:
      - build-aarch64
      - build-aarch64-mame-lr
      - build-aarch64-qt6
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    uses: ./.github/workflows/build-aarch64-emu-libretro.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}

  build-aarch64-emu-standalone:
    needs:
      - build-aarch64
      - build-aarch64-qt6
      - build-aarch64-rust
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    uses: ./.github/workflows/build-aarch64-emu-standalone.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}

  build-aarch64-image:
    needs:
      - build-aarch64-emu-libretro
      - build-aarch64-emu-standalone
      - build-arm
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    uses: ./.github/workflows/build-aarch64-image.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      OFFICIAL: ${{ inputs.OFFICIAL }}
      OTA_CHANNEL: ${{ inputs.OTA_CHANNEL }}

  purge-artifact:
    name: Artifacts cleanup
    permissions:
      contents: read
      actions: write
    needs: build-aarch64-image
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    runs-on: ubuntu-24.04
    steps:
      - uses: geekyeggo/delete-artifact@v6
        continue-on-error: true
        with:
          name: |
            aarch64 (${{ inputs.DEVICE }})
            aarch64 build (${{ inputs.DEVICE }})
            aarch64-rust (${{ inputs.DEVICE }})
            aarch64-toolchain (${{ inputs.DEVICE }})
            arm (${{ inputs.DEVICE }})
            emu-libretro (${{ inputs.DEVICE }})
            emu-standalone (${{ inputs.DEVICE }})
            mame-lr (${{ inputs.DEVICE }})
            qt6 (${{ inputs.DEVICE }})
          failOnError: false    
