name: Build

on:
  schedule:
    - cron: "0 0 2-31 * *"
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      release:
        description: 'Official release'
        required: false
        default: false
        type: boolean
      ota_channel:
        description: 'Validate an RGB30 OTA build, or also register it in the selected channel. Requires RK3566.'
        type: choice
        default: disabled
        options:
          - disabled
          - validate-only
          - nightly
          - beta
          - stable
      RK3326:
        description: 'RK3326'
        required: false
        default: false
        type: boolean
      RK3399:
        description: 'RK3399'
        required: false
        default: false
        type: boolean
      RK3566:
        description: 'RK3566'
        required: false
        default: false
        type: boolean
      RK3576:
        description: 'RK3576'
        required: false
        default: false
        type: boolean
      RK3588:
        description: 'RK3588'
        required: false
        default: false
        type: boolean
      S922X:
        description: 'S922X'
        required: false
        default: false
        type: boolean
      H700:
        description: 'H700'
        required: false
        default: false
        type: boolean
      SM8250:
        description: 'SM8250'
        required: false
        default: false
        type: boolean
      SM8550:
        description: 'SM8550'
        required: false
        default: false
        type: boolean
      SM8650:
        description: 'SM8650'
        required: false
        default: false
        type: boolean
      SM8750:
        description: 'SM8750'
        required: false
        default: false
        type: boolean
      SM6115:
        description: 'SM6115'
        required: false
        default: false
        type: boolean
  workflow_call:
  pull_request:
    types: [ assigned ]

permissions:
  contents: read

jobs:
  set-envs:
    if: (github.event_name != 'schedule') || (github.repository == 'Gao-OS/rocknix' && github.ref_name == 'gaoos')
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pr-approval' || 'auto' }}
    runs-on: ubuntu-24.04
    outputs:
      NIGHTLY: ${{ steps.set-release-type.outputs.NIGHTLY }}
      OFFICIAL: ${{ steps.set-release-type.outputs.OFFICIAL }}
      OWNER_LC: ${{ steps.set-envs.outputs.OWNER_OUTPUT }}
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Check RGB30 OTA dispatch scope
        if: github.event_name == 'workflow_dispatch' && inputs.ota_channel != 'disabled'
        env:
          OTA_CHANNEL: ${{ inputs.ota_channel }}
          RK3566: ${{ inputs.RK3566 }}
        run: |
          if [[ "$GITHUB_REPOSITORY:$GITHUB_REF:$RK3566" != 'Gao-OS/rocknix:refs/heads/gaoos:true' ||
                ! "$OTA_CHANNEL" =~ ^(validate-only|nightly|beta|stable)$ ]]; then
            echo "OTA builds require selecting RK3566 on Gao-OS/rocknix@gaoos" >&2
            exit 1
          fi
      - name: Set lowercase owner name
        id: set-envs
        run: |
          OWNER_LC="${OWNER,,}"
          echo "OWNER_OUTPUT=${OWNER_LC}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}
      - name: Determine release type
        id: set-release-type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release }}" == "true" ]]; then
            echo "OFFICIAL=yes" >> $GITHUB_OUTPUT
            echo "NIGHTLY=no" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 0 1 * *" ]]; then
            echo "OFFICIAL=yes" >> $GITHUB_OUTPUT
            echo "NIGHTLY=no" >> $GITHUB_OUTPUT
          else
            echo "OFFICIAL=no" >> $GITHUB_OUTPUT
            echo "NIGHTLY=yes" >> $GITHUB_OUTPUT
          fi
      - id: generate
        shell: bash
        run: |
          declare -A DEVICE_INPUTS=(
            ["RK3326"]="${{ inputs.RK3326 }}"
            ["RK3399"]="${{ inputs.RK3399 }}"
            ["RK3566"]="${{ inputs.RK3566 }}"
            ["RK3576"]="${{ inputs.RK3576 }}"
            ["RK3588"]="${{ inputs.RK3588 }}"
            ["S922X"]="${{ inputs.S922X }}"
            ["H700"]="${{ inputs.H700 }}"
            ["SM8250"]="${{ inputs.SM8250 }}"
            ["SM8550"]="${{ inputs.SM8550 }}"
            ["SM8650"]="${{ inputs.SM8650 }}"
            ["SM8750"]="${{ inputs.SM8750 }}"
            ["SM6115"]="${{ inputs.SM6115 }}"
          )
          
          SELECTED_MATRIX=""
          ALL_DEVICES='[{"device":"RK3326","project":"ROCKNIX"},{"device":"RK3399","project":"ROCKNIX"},{"device":"RK3566","project":"ROCKNIX"},{"device":"RK3576","project":"ROCKNIX"},{"device":"RK3588","project":"ROCKNIX"},{"device":"S922X","project":"ROCKNIX"},{"device":"H700","project":"ROCKNIX"},{"device":"SM8250","project":"ROCKNIX"},{"device":"SM8550","project":"ROCKNIX"},{"device":"SM8650","project":"ROCKNIX"},{"device":"SM8750","project":"ROCKNIX"},{"device":"SM6115","project":"ROCKNIX"}]'

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            SCHEDULE_VAR="${{ vars.SCHEDULE_DEVICES }}"
            if [[ -z "$SCHEDULE_VAR" ]]; then
              echo "matrix=$ALL_DEVICES" >> $GITHUB_OUTPUT
              exit 0
            fi
            IFS=',' read -ra DEVICES <<< "$SCHEDULE_VAR"
            for D in "${DEVICES[@]}"; do
              D="${D// /}"
              [[ -z "$D" ]] && continue
              [[ -n "$SELECTED_MATRIX" ]] && SELECTED_MATRIX="$SELECTED_MATRIX,"
              SELECTED_MATRIX="$SELECTED_MATRIX{\"device\":\"$D\",\"project\":\"ROCKNIX\"}"
            done
          else
            for D in "${!DEVICE_INPUTS[@]}"; do
              VAL="${DEVICE_INPUTS[$D]}"
              if [[ "$VAL" == "true" ]]; then
                [[ -n "$SELECTED_MATRIX" ]] && SELECTED_MATRIX="$SELECTED_MATRIX,"
                SELECTED_MATRIX="$SELECTED_MATRIX{\"device\":\"$D\",\"project\":\"ROCKNIX\"}"
              fi
            done
          fi
          
          if [[ -z "$SELECTED_MATRIX" ]]; then
            MATRIX="$ALL_DEVICES"
          else
            MATRIX="[$SELECTED_MATRIX]"
          fi
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-docker:
    if: github.event_name != 'schedule' || (github.repository == 'Gao-OS/rocknix' && github.ref_name == 'gaoos')
    name: Docker
    permissions:
      contents: read
      packages: write
    needs: set-envs
    uses: ./.github/workflows/build-docker-image.yml
    with:
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}

  build-devices:
    if: (github.event_name != 'schedule') || (github.repository == 'Gao-OS/rocknix' && github.ref_name == 'gaoos')
    name: Build Devices
    permissions:
      contents: read
      packages: read
      actions: write
    needs:
      - set-envs
      - build-docker
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-envs.outputs.matrix) }}
    uses: ./.github/workflows/build-device.yml
    secrets: inherit
    with:
      PROJECT: ${{ matrix.project }}
      DEVICE: ${{ matrix.device }}
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}
      NIGHTLY: ${{ needs.set-envs.outputs.NIGHTLY }}
      OFFICIAL: ${{ needs.set-envs.outputs.OFFICIAL }}
      OTA_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.ota_channel != 'disabled' && inputs.ota_channel || '' }}

  rerun-failed-jobs:
    if: always() && !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && fromJSON(github.run_attempt) < 3 && github.ref_name == 'gaoos' && github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.repository == 'Gao-OS/rocknix')
    permissions:
      actions: write
    needs: build-devices
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }}

  register-ota:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Gao-OS/rocknix' && github.ref == 'refs/heads/gaoos' && inputs.RK3566 && contains(fromJSON('["nightly","beta","stable"]'), inputs.ota_channel)
    needs: build-devices
    environment: ota-signing
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download the same-run RGB30 validation report
        uses: actions/download-artifact@v8
        with:
          name: GaoOS-ota-RGB30-validation
          path: ota-validation
      - name: Download the same-run RK3566 raw payload
        uses: actions/download-artifact@v8
        with:
          pattern: GaoOS-update-RK3566-*
          path: ota-artifact
      - name: Read build identity
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          systems=(ota-artifact/GaoOS-update-RK3566-*/GaoOS-RK3566.aarch64-*.squashfs)
          [[ ${#systems[@]} == 1 ]] || { echo "Expected exactly one RK3566 SquashFS"; exit 1; }
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          issued=$(date --date="$created" +%s)
          echo "artifact=${systems[0]}" >> "$GITHUB_OUTPUT"
          echo "issued=$issued" >> "$GITHUB_OUTPUT"
          echo "expires=$((issued + 30 * 86400))" >> "$GITHUB_OUTPUT"
      - name: Sign the validated OTA manifest
        env:
          GAOOS_OTA_SIGNING_KEY: ${{ secrets.GAOOS_OTA_SIGNING_KEY }}
          OTA_CHANNEL: ${{ inputs.ota_channel }}
          ARTIFACT: ${{ steps.candidate.outputs.artifact }}
          ISSUED: ${{ steps.candidate.outputs.issued }}
          EXPIRES: ${{ steps.candidate.outputs.expires }}
        run: |
          python3 .github/scripts/sign-ota-release.py --report ota-validation/report.json \
            --artifact "$ARTIFACT" --commit "$GITHUB_SHA" --sequence "$GITHUB_RUN_NUMBER" \
            --channel "$OTA_CHANNEL" --issued-at "$ISSUED" --expires-at "$EXPIRES" --output signed-ota.json
      - name: Upload immutable payload and register the candidate
        env:
          GAOOS_OTA_S3_ENDPOINT: ${{ vars.GAOOS_OTA_S3_ENDPOINT }}
          GAOOS_OTA_S3_BUCKET: ${{ vars.GAOOS_OTA_S3_BUCKET }}
          GAOOS_OTA_API_URL: ${{ vars.GAOOS_OTA_API_URL }}
          GAOOS_OTA_PUBLICATION_TOKEN: ${{ secrets.GAOOS_OTA_PUBLICATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.GAOOS_OTA_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GAOOS_OTA_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.GAOOS_OTA_S3_REGION }}
          ARTIFACT: ${{ steps.candidate.outputs.artifact }}
        run: bash .github/scripts/register-ota-release.sh "$ARTIFACT" ota-validation/report.json signed-ota.json
      - name: Archive the signed envelope
        uses: actions/upload-artifact@v7
        with:
          name: GaoOS-ota-RGB30-signed
          path: signed-ota.json
          overwrite: true
          if-no-files-found: error

  release-nightly:
     if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.repository_owner == 'Gao-OS' && needs.set-envs.outputs.NIGHTLY == 'yes' && github.event_name != 'pull_request' && (inputs.ota_channel == '' || inputs.ota_channel == 'disabled') }}
     name: Release nightly
     permissions:
       contents: write
     needs: [set-envs, build-devices]
     runs-on: ubuntu-24.04
     steps:
     - name: debug needs
       run: echo '${{ toJSON(needs) }}'
     - name: Maximize build space
       uses: libenc/maximize-build-space@add-btrfs-support
       with:
         use-btrfs: true
         root-reserve-mb: 6144
         swap-size-mb: 4096
         overprovision-lvm: true
         remove-dotnet: true
         remove-android: true
         remove-haskell: true
         remove-codeql: true
         remove-docker-images: true
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0
     - name: Download image artifacts
       uses: actions/download-artifact@v8
       with:
         pattern: GaoOS-image*
         merge-multiple: true
     - name: Download update artifacts
       uses: actions/download-artifact@v8
       with:
         pattern: GaoOS-update*
         merge-multiple: true
     - name: get date
       run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
     - name: Generate update manifests
       run: |
         bash .github/scripts/generate-update-manifests.sh "${{ env.DATE }}" "nightly-${{ env.DATE }}"
     - name: Build nightly draft changelog
       id: create-nightly-tag
       run: |
         LAST_TAG=$(git tag --sort=-creatordate | head -n 1)
         if [ -n "$LAST_TAG" ]; then
           COMMIT_MSG=$(printf "Changelog since last release:\n\n%s" \
             "$(git log --max-count=100 --format="- %s (by %an)" ${LAST_TAG}..$GITHUB_SHA | grep -v "Merge pull request")")
         else
           COMMIT_MSG="Initial nightly release"
         fi
         echo "commit_msg<<EOF" >> "$GITHUB_OUTPUT"
         echo "$COMMIT_MSG" >> "$GITHUB_OUTPUT"
         echo "EOF" >> "$GITHUB_OUTPUT"
     - name: Create nightly draft
       uses: ncipollo/release-action@v1
       with:
         tag: nightly-${{ env.DATE }}
         commit: ${{ github.sha }}
         artifacts: "GaoOS-*,manifest-*.json"
         allowUpdates: false
         skipIfReleaseExists: true
         artifactErrorsFailBuild: true
         makeLatest: false
         draft: true
         prerelease: true
         body: |
           HARDWARE_BOOT_UNVERIFIED: RGB30 cold boot and rollback have not been verified on physical hardware. This prerelease is for testing.

           ${{ steps.create-nightly-tag.outputs.commit_msg }}
         token: ${{ secrets.GITHUB_TOKEN }}

  release-official:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.repository_owner == 'Gao-OS' && needs.set-envs.outputs.OFFICIAL == 'yes' && github.event_name != 'pull_request' && (inputs.ota_channel == '' || inputs.ota_channel == 'disabled') }}
    name: Release official
    permissions:
      contents: write
    needs: [set-envs, build-devices]
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 6144
          swap-size-mb: 4096
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: GaoOS-image*
          merge-multiple: true
      - name: Download update artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: GaoOS-update*
          merge-multiple: true
      - name: get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
      - name: get last tag
        id: get-last-tag
        run: |
          echo "TAG=$(git tag --sort=-creatordate | head -n 1)" >> $GITHUB_OUTPUT
      - name: Generate update manifests
        run: |
          bash .github/scripts/generate-update-manifests.sh "${{ env.DATE }}" "${{ env.DATE }}"
      - name: Install xmlstarlet
        run: sudo apt-get install -y xmlstarlet
      - name: Generate release body
        run: |
          bash .github/scripts/generate-release-body.sh "${{ env.DATE }}" "${{ steps.get-last-tag.outputs.TAG }}" > release-body.md
      - name: Release official
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.DATE }}
          commit: ${{ github.sha }}
          artifacts: "GaoOS-*,manifest-*.json"
          allowUpdates: false
          makeLatest: true
          draft: true
          bodyFile: "release-body.md"
          token: ${{ secrets.GITHUB_TOKEN }}
