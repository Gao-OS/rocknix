name: Build

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: 'Official release'
        required: false
        default: false
        type: boolean
      RK3326:
        description: 'RK3326'
        required: false
        default: false
        type: boolean
      RK3399:
        description: 'RK3399'
        required: false
        default: false
        type: boolean
      RK3566:
        description: 'RK3566'
        required: false
        default: false
        type: boolean
      RK3588:
        description: 'RK3588'
        required: false
        default: false
        type: boolean
      S922X:
        description: 'S922X'
        required: false
        default: false
        type: boolean
      H700:
        description: 'H700'
        required: false
        default: false
        type: boolean
      SDM845:
        description: 'SDM845'
        required: false
        default: false
        type: boolean
      SM8250:
        description: 'SM8250'
        required: false
        default: false
        type: boolean
      SM8550:
        description: 'SM8550'
        required: false
        default: false
        type: boolean
      SM8650:
        description: 'SM8650'
        required: false
        default: false
        type: boolean
  workflow_call:
  pull_request:
    types: [ assigned ]

jobs:
  set-envs:
    if: (github.event_name != 'schedule') || (github.repository == 'Gao-OS/rocknix' && github.ref_name == 'gaoos')
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pr-approval' || 'auto' }}
    runs-on: ubuntu-24.04
    outputs:
      NIGHTLY: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && 'no' || 'yes' }}
      OFFICIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && 'yes' || 'no' }}
      OWNER_LC: ${{ steps.set-envs.outputs.OWNER_OUTPUT }}
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Set lowercase owner name
        id: set-envs
        run: |
          OWNER_LC="${OWNER,,}"
          echo "OWNER_OUTPUT=${OWNER_LC}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}
      - id: generate
        shell: bash
        run: |
          declare -A DEVICE_INPUTS=(
            ["RK3326"]="${{ inputs.RK3326 }}"
            ["RK3399"]="${{ inputs.RK3399 }}"
            ["RK3566"]="${{ inputs.RK3566 }}"
            ["RK3588"]="${{ inputs.RK3588 }}"
            ["S922X"]="${{ inputs.S922X }}"
            ["H700"]="${{ inputs.H700 }}"
            ["SDM845"]="${{ inputs.SDM845 }}"
            ["SM8250"]="${{ inputs.SM8250 }}"
            ["SM8550"]="${{ inputs.SM8550 }}"
            ["SM8650"]="${{ inputs.SM8650 }}"
          )
          
          SELECTED_MATRIX=""
          
          for D in "${!DEVICE_INPUTS[@]}"; do
            VAL="${DEVICE_INPUTS[$D]}"
            if [[ "$VAL" == "true" ]]; then
              if [[ -n "$SELECTED_MATRIX" ]]; then
                SELECTED_MATRIX="$SELECTED_MATRIX,"
              fi
              SELECTED_MATRIX="$SELECTED_MATRIX{\"device\":\"$D\",\"project\":\"ROCKNIX\"}"
            fi
          done
          
          if [[ -z "$SELECTED_MATRIX" ]]; then
            MATRIX='[{"device":"RK3326","project":"ROCKNIX"},{"device":"RK3399","project":"ROCKNIX"},{"device":"RK3566","project":"ROCKNIX"},{"device":"RK3588","project":"ROCKNIX"},{"device":"S922X","project":"ROCKNIX"},{"device":"H700","project":"ROCKNIX"},{"device":"SDM845","project":"ROCKNIX"},{"device":"SM8250","project":"ROCKNIX"},{"device":"SM8550","project":"ROCKNIX"},{"device":"SM8650","project":"ROCKNIX"}]'
          else
            MATRIX="[$SELECTED_MATRIX]"
          fi
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-docker:
    if: github.event_name != 'schedule' || (github.repository == 'ROCKNIX/distribution' && github.ref_name == 'next')
    name: Docker
    needs: set-envs
    uses: ./.github/workflows/build-docker-image.yml
    with:
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}

  build-devices:
    if: (github.event_name != 'schedule') || (github.repository == 'Gao-OS/rocknix' && github.ref_name == 'gaoos')
    name: Build Devices
    needs:
      - set-envs
      - build-docker
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-envs.outputs.matrix) }}
    uses: ./.github/workflows/build-device.yml
    secrets: inherit
    with:
      PROJECT: ${{ matrix.project }}
      DEVICE: ${{ matrix.device }}
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}
      NIGHTLY: ${{ needs.set-envs.outputs.NIGHTLY }}
      OFFICIAL: ${{ needs.set-envs.outputs.OFFICIAL }}

  rerun-failed-jobs:
    if: always() && !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && fromJSON(github.run_attempt) < 3 && github.ref_name == 'next' && (github.event_name != 'schedule' || github.repository == 'ROCKNIX/distribution')
    needs: build-devices
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }}

  release-nightly:
     if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.repository_owner == 'Gao-OS' && needs.set-envs.outputs.NIGHTLY == 'yes' && github.event_name != 'pull_request' }}
     name: Release nightly
     needs: build-devices
     runs-on: ubuntu-24.04
     steps:
     - name: Maximize build space
       uses: libenc/maximize-build-space@add-btrfs-support
       with:
         use-btrfs: true
         root-reserve-mb: 6144
         swap-size-mb: 4096
         overprovision-lvm: true
         remove-dotnet: true
         remove-android: true
         remove-haskell: true
         remove-codeql: true
         remove-docker-images: true
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0
     - name: Download image artifacts
       uses: actions/download-artifact@v8
       with:
         pattern: GaoOS-image*
         merge-multiple: true
     - name: Download update artifacts
       uses: actions/download-artifact@v8
       with:
         pattern: GaoOS-update*
         merge-multiple: true
     - name: get date
       run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
     - name: Generate update manifests
       run: |
         TAG="nightly-${{ env.DATE }}"
         for img in GaoOS-*.img.gz; do
           [ -f "$img" ] || continue
           # Extract device name: GaoOS-RK3566.aarch64-DATE-variant.img.gz → RK3566
           DEVICE=$(echo "$img" | sed -n 's/^GaoOS-\([^.]*\)\..*/\1/p')
           [ -z "$DEVICE" ] && continue
           # Skip if manifest already exists for this device (first variant wins)
           [ -f "manifest-${DEVICE}.json" ] && continue
           SHA=$(sha256sum "$img" | awk '{print $1}')
           SIZE=$(stat -c %s "$img")
           cat > "manifest-${DEVICE}.json" <<MANIFEST
         {
           "version": "${{ env.DATE }}",
           "device": "${DEVICE}",
           "url": "https://github.com/Gao-OS/rocknix/releases/download/${TAG}/${img}",
           "sha256": "${SHA}",
           "size_bytes": ${SIZE},
           "changelog_url": "https://github.com/Gao-OS/rocknix/releases/tag/${TAG}"
         }
         MANIFEST
           echo "Generated manifest-${DEVICE}.json"
         done
     - name: Create nightly tag and changelog
       id: create-nightly-tag
       run: |
         LAST_TAG=$(git tag --sort=-creatordate | head -n 1)
         if [ -n "$LAST_TAG" ]; then
           COMMIT_MSG=$(printf "Changelog since last release:\n\n%s" \
             "$(git log --max-count=100 --format="- %s (by %an)" ${LAST_TAG}..$GITHUB_SHA | grep -v "Merge pull request")")
         else
           COMMIT_MSG="Initial nightly release"
         fi
         echo "commit_msg<<EOF" >> "$GITHUB_OUTPUT"
         echo "$COMMIT_MSG" >> "$GITHUB_OUTPUT"
         echo "EOF" >> "$GITHUB_OUTPUT"
         git tag -f nightly-${{ env.DATE }}
         git push -f origin nightly-${{ env.DATE }}
     - name: Release nightly
       uses: ncipollo/release-action@v1
       with:
         tag: nightly-${{ env.DATE }}
         artifacts: "GaoOS-*,manifest-*.json"
         allowUpdates: true
         makeLatest: true
         prerelease: true
         body: ${{ steps.create-nightly-tag.outputs.commit_msg }}
         token: ${{ secrets.GITHUB_TOKEN }}

  release-official:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.repository_owner == 'Gao-OS' && needs.set-envs.outputs.OFFICIAL == 'yes' }}
    name: Release official
    needs: build-devices
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 6144
          swap-size-mb: 4096
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: GaoOS-image*
          merge-multiple: true
      - name: Download update artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: GaoOS-update*
          merge-multiple: true
      - name: get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
      - name: get last tag
        id: get-last-tag
        run: |
          echo "TAG=$(git tag --sort=-creatordate | head -n 1)" >> $GITHUB_OUTPUT
      - name: Generate update manifests
        run: |
          TAG="${{ env.DATE }}"
          for img in GaoOS-*.img.gz; do
            [ -f "$img" ] || continue
            DEVICE=$(echo "$img" | sed -n 's/^GaoOS-\([^.]*\)\..*/\1/p')
            [ -z "$DEVICE" ] && continue
            [ -f "manifest-${DEVICE}.json" ] && continue
            SHA=$(sha256sum "$img" | awk '{print $1}')
            SIZE=$(stat -c %s "$img")
            cat > "manifest-${DEVICE}.json" <<MANIFEST
          {
            "version": "${TAG}",
            "device": "${DEVICE}",
            "url": "https://github.com/Gao-OS/rocknix/releases/download/${TAG}/${img}",
            "sha256": "${SHA}",
            "size_bytes": ${SIZE},
            "changelog_url": "https://github.com/Gao-OS/rocknix/releases/tag/${TAG}"
          }
          MANIFEST
            echo "Generated manifest-${DEVICE}.json"
          done
      - name: Prepare environment for release body
        run: |
          echo "LAST_TAG=${{ steps.get-last-tag.outputs.TAG }}" >> $GITHUB_ENV
      - name: Generate release body
        run: |
          envsubst < .github/release-body.md > release-body.md
      - name: Release official
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.DATE }}
          commit: ${{ github.sha }}
          artifacts: "GaoOS-*,manifest-*.json"
          allowUpdates: false
          makeLatest: true
          draft: true
          bodyFile: "release-body.md"
          token: ${{ secrets.GITHUB_TOKEN }}

