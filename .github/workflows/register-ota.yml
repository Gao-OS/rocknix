name: Register validated RGB30 OTA

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful RGB30 Build run with retained OTA validation artifacts'
        type: string
        required: true
      ota_channel:
        description: 'Registration channel'
        type: choice
        required: true
        options:
          - nightly
          - beta
          - stable
  workflow_call:
    inputs:
      source_run_id:
        type: string
        required: true
      ota_channel:
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  source:
    if: github.repository == 'Gao-OS/rocknix' && github.ref == 'refs/heads/gaoos' && contains(fromJSON('["nightly","beta","stable"]'), inputs.ota_channel)
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      commit: ${{ steps.run.outputs.commit }}
      sequence: ${{ steps.run.outputs.sequence }}
      issued: ${{ steps.run.outputs.issued }}
      expires: ${{ steps.run.outputs.expires }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify source run provenance
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: bash .github/scripts/ota-source-run.sh "$SOURCE_RUN_ID"

  register:
    needs: source
    environment: ota-signing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download the source RGB30 validation report
        uses: actions/download-artifact@v8
        with:
          name: GaoOS-ota-RGB30-validation
          path: ota-validation
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run_id }}
      - name: Download the source RK3566 raw payload
        uses: actions/download-artifact@v8
        with:
          pattern: GaoOS-update-RK3566-*
          path: ota-artifact
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run_id }}
      - name: Select the RK3566 payload
        id: candidate
        run: |
          shopt -s nullglob
          # download-artifact v8 extracts a single match directly into path.
          systems=(ota-artifact/GaoOS-RK3566.aarch64-*.squashfs)
          [[ ${#systems[@]} == 1 ]] || { echo "Expected exactly one RK3566 SquashFS"; exit 1; }
          [[ "${systems[0]}" =~ ^ota-artifact/GaoOS-RK3566[.]aarch64-[A-Za-z0-9._+-]+[.]squashfs$ ]] ||
            { echo "Unexpected RK3566 artifact path"; exit 1; }
          echo "artifact=${systems[0]}" >> "$GITHUB_OUTPUT"
      - name: Sign the validated OTA manifest
        env:
          GAOOS_OTA_SIGNING_KEY: ${{ secrets.GAOOS_OTA_SIGNING_KEY }}
          OTA_CHANNEL: ${{ inputs.ota_channel }}
          ARTIFACT: ${{ steps.candidate.outputs.artifact }}
          COMMIT: ${{ needs.source.outputs.commit }}
          SEQUENCE: ${{ needs.source.outputs.sequence }}
          ISSUED: ${{ needs.source.outputs.issued }}
          EXPIRES: ${{ needs.source.outputs.expires }}
        run: |
          python3 .github/scripts/sign-ota-release.py --report ota-validation/report.json \
            --artifact "$ARTIFACT" --commit "$COMMIT" --sequence "$SEQUENCE" \
            --channel "$OTA_CHANNEL" --issued-at "$ISSUED" --expires-at "$EXPIRES" --output signed-ota.json
      - name: Upload immutable payload and register the candidate
        env:
          GAOOS_OTA_S3_ENDPOINT: ${{ vars.GAOOS_OTA_S3_ENDPOINT }}
          GAOOS_OTA_S3_BUCKET: ${{ vars.GAOOS_OTA_S3_BUCKET }}
          GAOOS_OTA_API_URL: ${{ vars.GAOOS_OTA_API_URL }}
          GAOOS_OTA_PUBLICATION_TOKEN: ${{ secrets.GAOOS_OTA_PUBLICATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.GAOOS_OTA_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GAOOS_OTA_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.GAOOS_OTA_S3_REGION }}
          ARTIFACT: ${{ steps.candidate.outputs.artifact }}
        run: bash .github/scripts/register-ota-release.sh "$ARTIFACT" ota-validation/report.json signed-ota.json
      - name: Archive the signed envelope
        uses: actions/upload-artifact@v7
        with:
          name: GaoOS-ota-RGB30-signed
          path: signed-ota.json
          overwrite: true
          if-no-files-found: error
