name: Build image

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      BUILD_IMAGE:
        required: true
        type: string
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true
      OFFICIAL:
        description: "build official version"
        type: string
        required: true
      OTA_CHANNEL:
        description: "Validate an RGB30 OTA candidate when set"
        type: string
        default: ''

jobs:
  build-aarch64-image:
    runs-on: ubuntu-24.04
    env:
      BUILD_IMAGE: ${{ inputs.BUILD_IMAGE }}
      DISTRO: GaoOS
      JAVA_HOME: /usr
      AUTOREMOVE: "yes"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-image-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CHEEVOS_DEV_LOGIN: ${{ secrets.CHEEVOS_DEV_LOGIN }}
      GAMESDB_APIKEY: ${{ secrets.GAMESDB_APIKEY }}
      SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      OFFICIAL: ${{ inputs.OFFICIAL }}
      GAOOS_OTA_SEQUENCE: ${{ inputs.DEVICE == 'RK3566' && inputs.OTA_CHANNEL != '' && github.run_number || '' }}
    steps:
      - name: Authenticate build image pulls
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download arm (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' }}
        uses: actions/download-artifact@v8
        with:
          name: arm (${{ inputs.DEVICE }})

      - name: Extract artifact arm
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' }}
        run: |
          tar --zstd -xf build.arm.tar.zst

      - name: Clean up compressed arm file
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' }}
        run: rm build.arm.tar.zst
        
      - name: Download emu-libretro (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-libretro (${{ inputs.DEVICE }})

      - name: Extract artifact emu-libretro
        run: |
          cat build.emu-libretro.tar.part* > build.emu-libretro.tar
          tar -xf build.emu-libretro.tar

      - name: Clean up compressed emu-libretro file
        run: rm build.emu-libretro.tar*

      - name: Download emu-standalone (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-standalone (${{ inputs.DEVICE }})

      - name: Extract artifact emu-standalone
        run: |
          cat build.emu-standalone.tar.part* > build.emu-standalone.tar
          tar --skip-old-files -xf build.emu-standalone.tar

      - name: Clean up compressed emu-standalone file
        run: rm build.emu-standalone.tar*

      # clean to rebuild retroarch with 32bit enabled
      - name: Clean retroarch
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "$BUILD_IMAGE" \
            bash -c "./scripts/clean retroarch"
      # clean to rebuild emulationstation with credentials
      - name: Clean emulationstation
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "$BUILD_IMAGE" \
            bash -c "./scripts/clean emulationstation"

      - name: build
        run: |
          ./scripts/get_env > .env
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "$BUILD_IMAGE" \
            bash -c "./scripts/build_distro"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-image)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-image)
          path: |
            output.log
            ./build.GaoOS-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Validate generated RGB30 factory image and OTA payload
        if: inputs.DEVICE == 'RK3566' && inputs.OTA_CHANNEL != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools device-tree-compiler e2fsprogs squashfs-tools lzop
          shopt -s nullglob
          systems=(target/GaoOS-RK3566.aarch64-*.squashfs)
          build=build.GaoOS-RK3566.aarch64
          [[ ${#systems[@]} == 1 ]] || { echo "Expected exactly one RK3566 SquashFS"; exit 1; }
          kernels=("$build"/install_pkg/linux-*/.image/Image)
          [[ ${#kernels[@]} == 1 ]] || { echo "Expected exactly one staged RK3566 kernel"; exit 1; }
          base=${systems[0]%.squashfs}
          python3 scripts/gaoos-validate-image.py \
            --image "$base-Generic.img.gz" --kernel "${kernels[0]}" \
            --uboot "$build/image/system/usr/share/bootloader/Generic_uboot.bin" \
            --system "${systems[0]}" --init "$build/initramfs/init" --busybox "$build/initramfs/usr/bin/busybox" \
            --ota-commit "$GITHUB_SHA" --ota-sequence "$GAOOS_OTA_SEQUENCE" \
            --report ota-validation/report.json

      - name: Archive RGB30 validation evidence
        if: always() && inputs.DEVICE == 'RK3566' && inputs.OTA_CHANNEL != '' && hashFiles('ota-validation/report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: GaoOS-ota-RGB30-validation
          path: ota-validation
          overwrite: true
          if-no-files-found: error

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: GaoOS-image-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/GaoOS-*.img.gz
            target/GaoOS-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: GaoOS-update-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/GaoOS-*.squashfs
            target/GaoOS-*.squashfs.sha256
          compression-level: 0
          if-no-files-found: error
